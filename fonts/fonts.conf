<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Vercel's serverless runtime ships no fonts and no fontconfig config, so
  librsvg (inside sharp) renders every glyph as tofu. This config points
  fontconfig at the TTFs bundled next to it and aliases the families the
  card/chart SVGs ask for.

  Activated by setting FONTCONFIG_PATH to this directory (/var/task/fonts
  on Vercel).
-->
<fontconfig>
  <!-- Fonts live beside this file. Both paths are listed so the same config
       works locally and inside the deployed function. -->
  <dir>/var/task/fonts</dir>
  <dir prefix="default">.</dir>

  <!-- /var/task is read-only; fontconfig must cache somewhere writable. -->
  <cachedir>/tmp/fontconfig</cachedir>

  <alias>
    <family>Arial</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>

  <!-- Last-resort match so any unknown family still renders real glyphs. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq">
      <string>DejaVu Sans Mono</string>
    </test>
    <edit name="family" mode="append_last">
      <string>DejaVu Sans</string>
    </edit>
  </match>
</fontconfig>
